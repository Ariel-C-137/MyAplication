<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CRUD con Firestore</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="createItem()">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input [(ngModel)]="newItem.email" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Contrasena</ion-label>
      <ion-input [(ngModel)]="newItem.password" required></ion-input>
    </ion-item>
    <ion-button expand="full" type="submit">Crear</ion-button>
  </form>

  <ion-list>
    <ion-item *ngFor="let item of items">
      {{ item.email }}
      <ion-button (click)="updateItem(item.id)">Actualizar</ion-button>
      <ion-button color="danger" (click)="deleteItem(item.id)">Eliminar</ion-button>
      
      {{ item.password }}
      <ion-button (click)="updateItem(item.id)">Actualizar</ion-button>
      <ion-button color="danger" (click)="deleteItem(item.id)">Eliminar</ion-button>
      </ion-item>
  </ion-list>
</ion-content>
